[package]
name = "ttml-tool"
version = "2.0.0"
description = "TTML Tool - a word-synced TTML lyric editor for Apple Music-style lyrics"
authors = ["Rimurulover <rimurusamllttmltool@gmail.com>"]
homepage = "https://github.com/rimuruslimetempest/AMLL-TTML-TOOL"
license = "AGPL-3.0"
repository = "https://github.com/rimuruslimetempest/AMLL-TTML-TOOL"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ttml_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
discord-rich-presence = "1.1.0"
tauri = { version = "2.9.5", features = ["devtools", "protocol-asset"] }
tao = "0.34"
tauri-plugin-log = "2.8.0"
window-vibrancy = "0.7"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = "1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "~2"
tauri-plugin-fs = "~2.4.5"
reqwest = { version = "0.13.4", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# Ties the media downloader's yt-dlp/FFmpeg processes to the app's lifetime.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
