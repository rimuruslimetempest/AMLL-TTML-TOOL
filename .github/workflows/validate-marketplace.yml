name: Validate marketplace submissions

on:
  pull_request:
    paths:
      - "docs/registry/**"
      - "docs/assets/previews/**"
      - "public/plugins/**"
      - "src/modules/plugins/official-plugins.json"
      - "scripts/validate-theme-registry.mjs"
      - "scripts/validate-plugin-registry.mjs"
      - "scripts/validate-marketplace.mjs"
      - "scripts/build-official-plugins.mjs"
      - "scripts/test-official-plugins.mjs"
      - ".github/workflows/validate-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate themes, plugins, hashes, manifests, and previews
        run: |
          node scripts/validate-theme-registry.mjs
          node scripts/validate-plugin-registry.mjs
      - name: Smoke-test the bundled official plugins
        run: node scripts/test-official-plugins.mjs
