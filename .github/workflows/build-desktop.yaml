name: Build desktop app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-version.mjs --tag "${{ github.ref_name }}"

  prepare-release-notes:
    name: Prepare release notes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.notes.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: notes
        name: Convert matching app changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if node scripts/generate-release-notes.mjs \
            --version "$version" \
            --changelog src/components/Dialogs/changelog.tsx \
            --output "$RUNNER_TEMP/release-notes.md"; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No readable changelog entry exists for v$version; GitHub-generated release notes will be used."
            echo "source=github" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload converted release notes
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.source == 'changelog'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: Ensure GitHub release exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "TTML Tool ${{ github.ref_name }}" \
              --notes "Desktop release ${{ github.ref_name }}. Release notes are finalized after all platform assets are uploaded."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-tauri-desktop:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    permissions:
      contents: write
    needs: [validate-release, prepare-release-notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            name: linux
            arch: x86_64
          - platform: windows-latest
            args: ""
            name: windows
            arch: x86_64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS
            arch: aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS
            arch: x86_64
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            name: macOS
            arch: universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install LLVM and Clang on macOS
        if: matrix.platform == 'macos-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15"
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libappindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build release and publish immutable tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TTML Tool ${{ github.ref_name }}
          releaseBody: Desktop release ${{ github.ref_name }}. Release notes are finalized after all platform assets are uploaded.
          includeUpdaterJson: true
          retryAttempts: 3
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build branch artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: pnpm tauri build --no-sign ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install AppImage repacking tool
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Remove host-incompatible libraries from AppImage
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          appimage_path=$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage_path"
          bash scripts/patch-appimage.sh "$appimage_path"
      - name: Replace published Linux AppImage
        if: matrix.platform == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          appimage_path=$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage_path"
          for asset in $(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name | select(endswith(".AppImage"))'); do
            gh release delete-asset "${{ github.ref_name }}" "$asset" --yes || true
          done
          gh release upload "${{ github.ref_name }}" "$appimage_path" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: TTML Tool ${{ matrix.name }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/release/bundle/**/*
            src-tauri/target/**/release/ttml-tool.exe
            src-tauri/target/**/release/ttml-tool

  finalize-release:
    name: Finalize release notes
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-tauri-desktop, prepare-release-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: needs.prepare-release-notes.outputs.source == 'changelog'
        with:
          name: release-notes
          path: release-notes
      - name: Set changelog-derived release notes
        if: needs.prepare-release-notes.outputs.source == 'changelog'
        run: gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --title "TTML Tool ${{ github.ref_name }}" --notes-file release-notes/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate fallback release notes
        if: needs.prepare-release-notes.outputs.source != 'changelog'
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > release-notes.md
          gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --title "TTML Tool ${{ github.ref_name }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
