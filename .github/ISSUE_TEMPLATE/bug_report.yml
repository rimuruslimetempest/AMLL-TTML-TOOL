name: Bug report
description: Report a reproducible problem with TTML Tool.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TTML Tool. Please search existing issues first.

        **Do not paste lyrics, audio files, private project data, account details, tokens, or API keys.** A short description of the problem is enough.

  - type: input
    id: version
    attributes:
      label: App version
      description: Find this in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Operating system
      description: Include the version and, on Linux, your distribution.
      placeholder: "Windows 11 24H2, macOS 15.2, or Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running TTML Tool?
      options:
        - Windows installer
        - macOS app
        - Linux package or AppImage
        - Web build
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of actions that triggers the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text if there is one. Remove private data first.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included lyrics, audio, private project data, credentials, or personal information in this report.
          required: true